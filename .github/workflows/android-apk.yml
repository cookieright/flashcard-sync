name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install website dependencies
        run: bun install --frozen-lockfile

      - name: Install app dependencies
        working-directory: android-app
        run: npm ci

      - name: Build app web bundle
        working-directory: android-app
        run: npm run build

      - name: Create Android project
        working-directory: android-app
        run: |
          [ -d android ] || npx cap add android
          mkdir -p assets
          cp ../public/icons/icon-512.png assets/icon-only.png
          npx --yes @capacitor/assets@3.0.5 generate --android \
            --iconBackgroundColor '#faf7f0' --splashBackgroundColor '#faf7f0' || echo "icon generation skipped"
          cp -r native-res/. android/app/src/main/res/
          npx cap sync android

      - name: Set version
        working-directory: android-app/android
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle

      - name: Use fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp android-app/keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk flashwords-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: flashwords-apk
          path: flashwords-*.apk
